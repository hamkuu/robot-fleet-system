name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"

env:
  PROJECT_ID: robot-fleet
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/robot-fleet/robot-fleet/backend:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push image
        run: |
          gcloud builds submit ./backend \
            --tag ${{ env.IMAGE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy backend as Cloud Run service
        run: |
          gcloud run services update backend \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy MQTT subscriber as Cloud Run worker pool
        run: |
          gcloud run worker-pools update mqtt-subscriber \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

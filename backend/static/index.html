<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Browse and manage published images." />
    <title>Images</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>Fleet Images</h1>
        <p><strong id="image-count">—</strong> published</p>
      </div>
      <div class="actions">
        <button class="button" id="refresh" type="button">Refresh</button>
        <button class="button button-primary" id="open-upload" type="button">Add image</button>
      </div>
    </header>

    <main>
      <div class="image-grid" id="image-grid" aria-live="polite"></div>

      <div class="empty-state" id="empty-state" hidden>
        <p>No images have been published.</p>
        <button class="button button-primary" id="empty-upload" type="button">Add image</button>
      </div>
    </main>

    <dialog id="upload-dialog">
      <form class="dialog-form" id="upload-form">
        <div class="dialog-header">
          <h2>Add image</h2>
          <button class="close-button close-dialog" type="button" aria-label="Close">×</button>
        </div>

        <label>
          <span>Image</span>
          <input id="upload-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" required />
          <small id="upload-file-name">JPEG, PNG, or WebP. Maximum 10 MB.</small>
        </label>

        <label>
          <span>Device ID</span>
          <input name="device_id" type="text" placeholder="robot-01" required />
        </label>

        <label>
          <span>Captured at</span>
          <input id="captured-at" name="captured_at" type="datetime-local" required />
        </label>

        <label>
          <span>Metadata <small>(JSON object)</small></span>
          <textarea name="metadata" rows="5" spellcheck="false">{}</textarea>
        </label>

        <div class="dialog-actions">
          <button class="button close-dialog" type="button">Cancel</button>
          <button class="button button-primary" type="submit">Add image</button>
        </div>
      </form>
    </dialog>

    <dialog id="edit-dialog">
      <form class="dialog-form" id="edit-form">
        <div class="dialog-header">
          <h2>Edit image</h2>
          <button class="close-button close-dialog" type="button" aria-label="Close">×</button>
        </div>

        <input name="id" type="hidden" />

        <label>
          <span>Filename</span>
          <input name="filename" type="text" required />
        </label>

        <label>
          <span>Metadata <small>(JSON object)</small></span>
          <textarea name="metadata" rows="7" spellcheck="false"></textarea>
        </label>

        <div class="dialog-actions">
          <button class="button close-dialog" type="button">Cancel</button>
          <button class="button button-primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
